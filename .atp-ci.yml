image: "archlinux:latest"

stages:
  - build

build-linux-x64:
  stage: build
  before_script:
    - pacman-key --init
    - pacman -Syu --needed --noconfirm ninja cmake gcc gcc-libs glibc kcoreaddons kcrash kdbusaddons ki18n kirigami knotifications kwindowsystem polkit-qt6 qt6-base qt6-declarative extra-cmake-modules kdoctools
  script:
    - cmake -G Ninja -DBUILD_TESTING=ON -B build .
    - cmake --build build
    - DESTDIR=out cmake --install build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 6 mos
    paths:
      - out/

